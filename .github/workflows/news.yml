name: MR. ROBOT — Xəbər Botu

on:
  schedule:
    - cron: '*/15 * * * *'  # каждые 15 минут
  workflow_dispatch:         # можно запускать вручную

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser deep-translator python-telegram-bot==20.7

      - name: Load seen articles cache
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-cache
          restore-keys: |
            seen-articles-cache

      - name: Run Telegram news bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python mr_robot_news.py
